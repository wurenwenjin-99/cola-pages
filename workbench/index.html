<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>津津工作台</title>
<style>
@font-face{
  font-family:'方正像素12';
  src:url('方正像素12.TTF') format('truetype');
  font-display:swap;
}
:root {
  --bg: #F2EDE3; --card: #FBF8F1; --tile: #E9E2D3;
  --primary: #B08D57; --primary-light: #E2D6BF; --primary-deep: #8A6D3F;
  --border: #D6CDB9; --rose: #8A8174;
  --green: #8FA98F; --orange: #B06050; --sky: #8FA3B8;
  --ink: #3D3A34; --ink2: #6E675C; --ink3: #9C9488;
  --radius: 16px; --shadow: 0 4px 14px rgba(61,58,52,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'方正像素12','FZXS12','PingFang SC',sans-serif;
  font-size:15px;line-height:1.6;color:var(--ink);
  background:linear-gradient(180deg,#F4F0E7 0%,#E8E0CD 100%);max-width:480px;margin:0 auto;
  min-height:100dvh;padding-top:calc(env(safe-area-inset-top,0px) + 22px);padding-bottom:40px;
}
::selection{background:var(--primary-light);color:var(--ink)}

/* Tabs */
.tabs{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:12px 12px 0;gap:6px}
.tab{
  flex:1;text-align:center;padding:10px 4px;border-radius:12px 12px 0 0;
  font-size:.8rem;font-weight:600;color:var(--ink3);cursor:pointer;
  background:transparent;border:none;transition:.2s
}
.tab.active{color:var(--primary);background:var(--card);box-shadow:0 -2px 10px rgba(61,58,52,.08)}
.tab .emoji{display:block;font-size:1.2rem;margin-bottom:2px}

/* Panels */
.panel{display:none;background:var(--card);padding:20px 16px;border-radius:0 0 var(--radius) var(--radius);margin:0 12px;}
.panel.active{display:block}

.section-title{font-size:1.1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title .icon{font-size:1.3rem}

/* Calendar */
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.cal-day{
  aspect-ratio:1;border-radius:12px;background:var(--tile);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:600;color:var(--ink2);cursor:pointer;
  position:relative;transition:.2s;border:2px solid transparent;min-height:56px
}
.cal-day.today{border-color:var(--primary);background:#EFE7D5}
.day-stars{position:absolute;inset:0;pointer-events:none;z-index:0}
.day-stars i{position:absolute;width:12px;height:12px;font-style:normal;display:block;filter:drop-shadow(0 1.5px 1.5px rgba(61,58,52,.35))}
.day-stars i svg{width:100%;height:100%;display:block}
.day-stars em{position:absolute;font-style:normal;font-size:.5rem;color:var(--primary-deep);font-weight:700}
.cal-day .day-num{font-size:.85rem;margin-bottom:2px;position:relative;z-index:1}
.cal-day .day-label{position:relative;z-index:1}
.cal-day .day-label{font-size:.6rem;color:var(--ink3)}

/* Day detail */
.day-detail{display:none;margin-bottom:16px}
.day-detail.active{display:block}
.day-detail h4{font-size:.9rem;margin-bottom:8px;color:var(--ink2)}
.task-item{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:var(--tile);border-radius:10px;margin-bottom:6px
}
.task-item .badge{
  font-size:.65rem;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap
}
.badge-media{background:rgba(176,141,87,.16);color:#8A6D3F}
.badge-daily{background:rgba(143,163,184,.2);color:#5F7589}
.badge-custom{background:rgba(176,96,80,.12);color:#A05545}
.task-item .task-title{flex:1;font-size:.85rem}
.task-item .del-btn{font-size:.75rem;color:var(--ink3);cursor:pointer;border:none;background:none;padding:4px}

/* Add task form */
.add-form{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.add-form select,.add-form input{
  padding:10px 12px;border-radius:10px;border:1px solid #D6CDB9;
  font-size:.85rem;background:var(--bg);width:100%
}
.add-form .row{display:flex;gap:8px}
.add-form .save-btn{
  padding:10px;border-radius:10px;background:var(--primary);color:#FBF8F1;
  border:none;font-size:.85rem;font-weight:600;cursor:pointer
}

/* Milk counter */
.big-counter{text-align:center;padding:24px 0}
.big-counter .count{font-size:3.5rem;font-weight:400;line-height:1;font-family:'方正像素12','FZXS12','PingFang SC',sans-serif}
.big-counter .count.cheat{color:var(--primary-deep)}
.big-counter .label{font-size:.85rem;color:var(--ink3);margin-top:6px}
.big-counter .cheat-badge{
  display:inline-block;padding:6px 16px;border-radius:20px;
  background:var(--primary);color:#FBF8F1;font-weight:700;font-size:.85rem;margin-top:8px
}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--tile);border-radius:12px;margin-bottom:16px}
.toggle-row .toggle-label{font-weight:600;font-size:.9rem}
.switch{position:relative;width:52px;height:30px}
.switch input{opacity:0;width:0;height:0}
.switch .slider{
  position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;
  background:#D8D0BE;border-radius:30px;transition:.3s
}
.switch .slider::before{
  content:'';position:absolute;height:24px;width:24px;left:3px;bottom:3px;
  background:#fff;border-radius:50%;transition:.3s
}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider::before{transform:translateX(22px)}
.switch.cheat input:checked+.slider{background:var(--primary)}

/* Photos */
.photo-section{display:flex;gap:12px;margin-bottom:16px}
.photo-card{
  flex:1;background:var(--tile);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;padding:16px 8px;
  gap:8px;cursor:pointer;border:2px dashed #C9BFAA;transition:.2s;min-height:100px;justify-content:center
}
.photo-card.has-photo{border-style:solid;border-color:var(--green)}
.photo-card img.photo{width:100%;border-radius:8px;object-fit:cover;max-height:160px}
.photo-card .label{font-size:.75rem;color:var(--ink3);font-weight:500}
.photo-card .icon{font-size:1.5rem}

/* Counters */
.counter-row{display:flex;gap:12px;margin-bottom:16px}
.counter-box{
  flex:1;background:var(--tile);border-radius:16px;
  padding:20px 16px;text-align:center
}
.counter-box .emoji{font-size:1.5rem;margin-bottom:4px}
.counter-box .num{font-size:2.2rem;font-weight:400;line-height:1;font-family:'方正像素12','FZXS12','PingFang SC',sans-serif}
.counter-box .unit{font-size:.75rem;color:var(--ink3)}
.counter-box .btn-group{display:flex;gap:8px;justify-content:center;margin-top:12px}
.btn-round{
  width:40px;height:40px;border-radius:50%;border:none;
  font-size:1.2rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center
}
.btn-plus{background:var(--primary);color:#FBF8F1}
.btn-minus{background:#E2DAC6;color:var(--ink2)}

/* Collapse */
.collapse{margin-top:16px}
.collapse-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;cursor:pointer;border-top:1px solid #DCD3BF;font-weight:600;font-size:.9rem
}
.collapse-header .arrow{transition:.25s;font-size:.75rem}
.collapse.open .arrow{transform:rotate(180deg)}
.collapse-body{display:none;padding-bottom:12px}
.collapse.open .collapse-body{display:block}

/* Weekly summary */
.summary-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.summary-day{
  text-align:center;padding:8px 2px;border-radius:8px;background:var(--bg);font-size:.65rem
}
.summary-day .s-num{font-size:.9rem;font-weight:700;display:block}
.summary-day.done{background:rgba(143,169,143,.2);color:#5F7F5F}
.summary-day.missed{background:rgba(176,96,80,.12);color:#A05545}

.photo-compare{display:flex;overflow-x:auto;gap:8px;padding-bottom:8px}
.photo-compare .compare-card{
  min-width:70px;border-radius:10px;background:var(--tile);padding:6px;text-align:center;font-size:.65rem
}
.photo-compare .compare-card img{width:100%;border-radius:6px;object-fit:cover;height:60px}
.photo-compare .compare-card .day-label{font-weight:600;margin:4px 0}

.history-table{width:100%;font-size:.8rem}
.history-table td,.history-table th{padding:8px 4px;text-align:center}
.history-table th{color:var(--ink3);font-weight:500;border-bottom:2px solid #DCD3BF}
.history-table td{border-bottom:1px solid #EBE4D2}


.empty{text-align:center;color:var(--ink3);font-size:.8rem;padding:12px 0}

/* Sport calendar */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.month-nav .nav-btn{background:none;border:none;font-size:1.2rem;color:var(--primary-deep);cursor:pointer;padding:4px 14px}
.month-nav .month-title{font-weight:700;font-size:.95rem}
.sport-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.sport-cal .wk{font-size:.6rem;color:var(--ink3);text-align:center;padding:4px 0}
.sport-day{
  aspect-ratio:1;border-radius:10px;background:var(--tile);
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:600;color:var(--ink2);cursor:pointer;
  border:2px solid transparent;position:relative
}
.sport-day .day-num{position:relative;z-index:1}
.sport-day.empty{background:transparent;cursor:default}
.sport-day.selected{border-color:var(--primary);background:#EFE7D5}
.sport-day.today{border-color:var(--primary-deep)}
.sport-form{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.sport-form select,.sport-form input{
  padding:10px 12px;border-radius:10px;border:1px solid #D6CDB9;
  font-size:.85rem;background:var(--bg);width:100%
}
.route-row{display:flex;gap:8px;align-items:center}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:rgba(176,141,87,.16);color:#8A6D3F;font-size:.7rem;
  padding:5px 10px;border-radius:20px;display:flex;align-items:center;gap:6px
}
.chip .x{cursor:pointer;font-weight:700}
.day-hint{font-size:.7rem;color:var(--ink3)}

/* Sport photo */
.sport-photo-row{display:flex;align-items:center;gap:8px}
.sport-photo-label{
  font-size:.75rem;color:var(--ink2);cursor:pointer;
  border:1.5px dashed #C9BFAA;border-radius:10px;padding:8px 12px;
  background:var(--bg);flex:1;text-align:center
}
.sport-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;cursor:zoom-in;flex:0 0 auto;border:1px solid var(--border)}

/* Lightbox */
.lightbox{
  position:fixed;inset:0;z-index:1000;background:rgba(20,18,14,.92);
  display:none;align-items:center;justify-content:center;cursor:zoom-out
}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:10px}

/* Period summary */
.period-title{font-weight:700;font-size:.85rem;margin:12px 0 6px;color:var(--ink2)}
.period-title:first-child{margin-top:0}
.period-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.period-stat{
  background:var(--tile);border-radius:10px;padding:8px 10px;
  text-align:center;font-size:.7rem;color:var(--ink2);flex:1;min-width:64px
}
.period-stat b{display:block;font-size:1.05rem;color:var(--ink);font-weight:700}

/* Splash screen */
.splash{
  position:fixed;inset:0;z-index:999;
  background:linear-gradient(160deg,#3A362E 0%,#5A5240 100%);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .6s ease;cursor:pointer
}
.splash.hide{opacity:0;pointer-events:none}
.type-line{
  font-family:'方正像素12','FZXS12','PingFang SC',monospace;
  font-size:1.35rem;font-weight:400;color:#F2EDE3;
  letter-spacing:.06em;white-space:pre
}
.caret{display:inline-block;width:.52em;height:1em;background:#F2EDE3;vertical-align:-.12em;margin-left:2px;animation:caretBlink .9s steps(1) infinite}
@keyframes caretBlink{50%{opacity:0}}
</style>
</head>
<body>

<!-- Splash screen -->
<div class="splash" id="splash">
  <div class="type-line"><span id="typeOut"></span><span class="caret"></span></div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" data-tab="tasks"><span class="emoji">📋</span>每周任务</button>
  <button class="tab" data-tab="milk"><span class="emoji">🥛</span>戒牛奶</button>
  <button class="tab" data-tab="body"><span class="emoji">💩</span>拉粑喝水</button>
  <button class="tab" data-tab="sport"><span class="emoji">🏃</span>动起来</button>
</div>

<!-- Panel 1: 每周任务 -->
<div class="panel active" id="panel-tasks">
  <div class="section-title"><span class="icon">📋</span>每周任务</div>
  <div class="calendar" id="taskCal"></div>
  <div class="day-detail" id="dayDetail">
    <h4 id="dayDetailTitle"></h4>
    <div id="dayTaskList"></div>
  </div>

  <div class="add-form">
    <select id="taskType">
      <option value="自媒体更新">自媒体更新</option>
      <option value="日常事件">日常事件</option>
      <option value="__custom">自定义…</option>
    </select>
    <input type="text" id="customType" placeholder="输入自定义类型" style="display:none">
    <div class="day-hint" id="taskDayHint"></div>
    <input type="text" id="taskTitle" placeholder="更新内容标题…">
    <button class="save-btn" id="addTaskBtn">➕ 添加任务</button>
  </div>

  <div class="collapse" id="taskSummary">
    <div class="collapse-header"><span>📊 本周总结</span><span class="arrow">▼</span></div>
    <div class="collapse-body"><div id="taskSummaryContent"></div></div>
  </div>

  <div class="collapse" id="tasksPeriod">
    <div class="collapse-header"><span>📊 月末总结</span><span class="arrow">▼</span></div>
    <div class="collapse-body"><div id="tasksPeriodContent"></div></div>
  </div>
</div>

<!-- Panel 2: 戒牛奶 -->
<div class="panel" id="panel-milk">
  <div class="section-title"><span class="icon">🥛</span>戒牛奶</div>

  <div class="big-counter" id="milkCounter">
    <div class="count" id="milkDays">--</div>
    <div class="label">已戒第 <span id="milkDaysNum">--</span> 天</div>
    <div class="cheat-badge" id="cheatBadge" style="display:none">🎉 放纵日</div>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">今日打卡</span>
    <label class="switch" id="milkSwitchWrap">
      <input type="checkbox" id="milkToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="photo-section">
    <div class="photo-card" id="photoFace">
      <span class="icon">🧑</span>
      <span class="label">脸部照片</span>
      <input type="file" accept="image/*" style="display:none" id="faceInput">
    </div>
    <div class="photo-card" id="photoLegs">
      <span class="icon">🦵</span>
      <span class="label">腿部照片</span>
      <input type="file" accept="image/*" style="display:none" id="legsInput">
    </div>
  </div>

  <div class="collapse" id="milkSummary">
    <div class="collapse-header"><span>📊 本周总结（7天照片对比）</span><span class="arrow">▼</span></div>
    <div class="collapse-body"><div id="milkSummaryContent"></div></div>
  </div>

  <div class="collapse" id="milkPeriod">
    <div class="collapse-header"><span>📊 月末总结</span><span class="arrow">▼</span></div>
    <div class="collapse-body"><div id="milkPeriodContent"></div></div>
  </div>
</div>

<!-- Panel 3: 拉粑喝水 -->
<div class="panel" id="panel-body">
  <div class="section-title"><span class="icon">💩</span>今日记录</div>

  <div class="counter-row">
    <div class="counter-box">
      <div class="emoji">💧</div>
      <div class="num" id="waterCount">0</div>
      <div class="unit">升 / 今日</div>
      <div class="btn-group">
        <button class="btn-round btn-minus" id="waterMinus">−</button>
        <button class="btn-round btn-plus" id="waterPlus">+</button>
      </div>
    </div>
    <div class="counter-box">
      <div class="emoji">💩</div>
      <div class="num" id="poopCount">0</div>
      <div class="unit">次 / 今日</div>
      <div class="btn-group">
        <button class="btn-round btn-minus" id="poopMinus">−</button>
        <button class="btn-round btn-plus" id="poopPlus">+</button>
      </div>
    </div>
  </div>

  <div class="collapse" id="bodyHistory">
    <div class="collapse-header"><span>📅 历史记录（最近7天）</span><span class="arrow">▼</span></div>
    <div class="collapse-body"><div id="bodyHistoryContent"></div></div>
  </div>

  <div class="collapse" id="bodyPeriod">
    <div class="collapse-header"><span>📊 月末总结</span><span class="arrow">▼</span></div>
    <div class="collapse-body"><div id="bodyPeriodContent"></div></div>
  </div>
</div>

<!-- Panel 4: 运动 -->
<div class="panel" id="panel-sport">
  <div class="section-title"><span class="icon">🏃</span>动起来</div>

  <div class="month-nav">
    <button class="nav-btn" id="sportPrev">‹</button>
    <span class="month-title" id="sportMonthTitle"></span>
    <button class="nav-btn" id="sportNext">›</button>
  </div>
  <div class="sport-cal" id="sportCal"></div>

  <div class="day-detail active">
    <h4 id="sportDayTitle"></h4>
    <div id="sportDayList"></div>
  </div>

  <div class="sport-form">
    <select id="sportType">
      <option value="攀岩">攀岩</option>
      <option value="跑步">跑步</option>
      <option value="游泳">游泳</option>
      <option value="骑行">骑行</option>
      <option value="力量训练">力量训练</option>
      <option value="瑜伽">瑜伽</option>
      <option value="球类">球类</option>
      <option value="其他">其他</option>
    </select>
    <select id="sportDur">
      <option value="0.5">0.5 小时</option>
      <option value="1" selected>1 小时</option>
      <option value="1.5">1.5 小时</option>
      <option value="2">2 小时</option>
      <option value="2.5">2.5 小时</option>
      <option value="3">3 小时</option>
      <option value="3.5">3.5 小时</option>
      <option value="4">4 小时</option>
      <option value="4.5">4.5 小时</option>
      <option value="5">5 小时</option>
    </select>
    <div class="route-row" id="routeRow" style="display:none">
      <select id="routeGrade">
        <option value="V3">V3</option><option value="V4">V4</option>
        <option value="V5">V5</option><option value="V6">V6</option>
        <option value="V7">V7</option><option value="V8">V8</option>
      </select>
      <select id="routeCount">
        <option value="1">1条</option><option value="2">2条</option><option value="3">3条</option>
        <option value="4">4条</option><option value="5">5条</option><option value="6">6条</option>
        <option value="7">7条</option><option value="8">8条</option><option value="9">9条</option>
      </select>
      <button class="save-btn" id="routeAddBtn" style="flex:0 0 auto">＋</button>
    </div>
    <div class="chip-row" id="routeChips"></div>
    <input type="text" id="sportNote" placeholder="备注（可选）…">
    <div class="sport-photo-row">
      <input type="file" id="sportPhoto" accept="image/*" style="display:none">
      <label class="sport-photo-label" for="sportPhoto">📷 添加照片（可选）</label>
      <img class="sport-thumb" id="sportPhotoPreview" style="display:none" alt="">
    </div>
    <button class="save-btn" id="sportAddBtn">➕ 添加运动记录</button>
  </div>

  <div class="collapse" id="sportPeriod">
    <div class="collapse-header"><span>📊 月末总结</span><span class="arrow">▼</span></div>
    <div class="collapse-body"><div id="sportPeriodContent"></div></div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt=""></div>

<script>
/* ==================== STORAGE ==================== */
const S = {
  mem:{},
  get(k,d){try{const v=localStorage.getItem('jinjin_'+k);return v?JSON.parse(v):d}catch(e){return this.mem[k]!==undefined?this.mem[k]:d}},
  set(k,v){this.mem[k]=v;try{localStorage.setItem('jinjin_'+k,JSON.stringify(v))}catch(e){}}
};

/* ==================== HELPERS ==================== */
function today(){return new Date().toISOString().slice(0,10)}
function getMonday(d){
  const dt=new Date(d);const day=dt.getDay();
  const diff=day===0?-6:1-day;dt.setDate(dt.getDate()+diff);
  return dt.toISOString().slice(0,10);
}
function weekDays(){
  const m=getMonday(today());const days=[];
  for(let i=0;i<7;i++){const d=new Date(m);d.setDate(d.getDate()+i);days.push(d.toISOString().slice(0,10))}
  return days;
}
function dayLabel(d){const dt=new Date(d+'T00:00');return['周日','周一','周二','周三','周四','周五','周六'][dt.getDay()]}
function dayNum(d){return new Date(d+'T00:00').getDate()}
function fmtDate(d){const dt=new Date(d+'T00:00');return `${dt.getMonth()+1}/${dt.getDate()}`}
function compressImage(file,maxSide,quality,cb){
  const reader=new FileReader();
  reader.onload=function(){
    const img=new Image();
    img.onload=function(){
      try{
        let w=img.width,h=img.height;
        if(Math.max(w,h)>maxSide){const r=maxSide/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        let data=canvas.toDataURL('image/jpeg',quality);
        if(data.length>800000)data=canvas.toDataURL('image/jpeg',0.5);
        cb(data);
      }catch(e){cb(null)}
    };
    img.onerror=function(){cb(null)};
    img.src=reader.result;
  };
  reader.onerror=function(){cb(null)};
  reader.readAsDataURL(file);
}
/* ---- period summary helpers ---- */
function ymKey(d){return d.slice(0,7)}
function qKey(d){return d.slice(0,4)+'-Q'+Math.ceil(+d.slice(5,7)/3)}
function yKey(d){return d.slice(0,4)}
function periodStat(label,val){return `<div class="period-stat"><b>${val}</b>${label}</div>`}
function spanDays(dates){
  if(!dates.length)return 0;
  const min=Math.min(...dates.map(d=>+new Date(d)));
  return Math.floor((Date.now()-min)/86400000);
}
/* list: items with dateStr; stat: (items)=>html string; returns full period html */
function periodSummary(dates,stat){
  const span=spanDays(dates);
  const td=today();
  const groups=[
    ['📅 本月',ymKey(td),d=>ymKey(d)===ymKey(td)],
    ['🗓 本季',qKey(td),d=>qKey(d)===qKey(td)],
    ['🎆 本年',yKey(td),d=>yKey(d)===yKey(td)]
  ];
  let html='';
  const show=[true,span>=90,span>=365];
  groups.forEach((g,i)=>{
    if(!show[i])return;
    const items=dates.filter(g[2]);
    html+=`<div class="period-title">${g[0]}（${g[1]}）</div><div class="period-grid">${stat(items)}</div>`;
  });
  return html;
}
const STICKERS={
  '自媒体更新':['star','#8FA3B8'],
  '日常事件':['circle','#8FA98F'],
  '攀岩':['tri','#B06050'],
  '跑步':['circle','#8FA98F'],

};
const STICKER_PATHS={
  star:'M12 2.5l2.8 6 6.7.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.1 1.3-6.6L2.5 9.3l6.7-.8z',
  circle:'<circle cx="12" cy="12" r="8"/>',

};
function stickerSVG(type){
  const [shape,fill]=STICKERS[type]||['star','#F0C860'];
  const body=shape==='circle'||shape==='square'?STICKER_PATHS[shape]:`<path d="${STICKER_PATHS[shape]}"/>`;
  return `<svg viewBox="0 0 24 24"><g fill="${fill}" stroke="#8A6D3F" stroke-width="1">${body}</g></svg>`;
}
function stickerRow(types){
  if(!types||!types.length)return '';
  const n=Math.min(types.length,4);
  let s='<span class="day-stars">';
  for(let i=0;i<n;i++){
    const top=Math.round(Math.random()*105-10);
    const left=Math.round(Math.random()*105-10);
    const rot=Math.round(Math.random()*50-25);
    s+=`<i style="top:${top}%;left:${left}%;transform:rotate(${rot}deg)">${stickerSVG(types[i])}</i>`;
  }
  if(types.length>4)s+=`<em style="top:${Math.round(Math.random()*70+15)}%;left:${Math.round(Math.random()*70+15)}%">+${types.length-4}</em>`;
  return s+'</span>';
}

function isCheatDay(start){
  if(!start)return false;
  const diff=Math.floor((new Date(today())-new Date(start))/(86400000));
  return diff>=0&&diff%14===13; // day 14, 28, 42...
}

function renderPhotoCard(id,key,src){
  const card=document.getElementById(id);
  const input=card.querySelector('input');
  if(src){
    card.classList.add('has-photo');
    const existing=card.querySelector('img.photo');
    if(existing)existing.src=src;
    else{
      const img=document.createElement('img');img.className='photo';img.src=src;
      card.querySelector('.icon')?.remove();
      card.prepend(img);
    }
  }else{
    card.classList.remove('has-photo');
    const img=card.querySelector('img.photo');if(img)img.remove();
    if(!card.querySelector('.icon')){
      const icon=document.createElement('span');icon.className='icon';
      icon.textContent=key==='face'?'🧑':'🦵';
      card.prepend(icon);
    }
  }
  input.onchange=function(){
    const file=this.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(){
      const img=new Image();
      img.onload=function(){
        try{
          const max=900;
          let w=img.width,h=img.height;
          if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}
          const canvas=document.createElement('canvas');
          canvas.width=w;canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          let data=canvas.toDataURL('image/jpeg',0.82);
          if(data.length>1200000)data=canvas.toDataURL('image/jpeg',0.6);
          const photos=S.get('milkPhotos',{});
          if(!photos[today()])photos[today()]={};
          photos[today()][key]=data;
          S.set('milkPhotos',photos);
          renderMilk();
        }catch(e){alert('照片处理失败，请重试')}
      };
      img.onerror=function(){alert('照片读取失败，请重试或换一张')};
      img.src=reader.result;
    };
    reader.onerror=function(){alert('照片读取失败，请重试')};
    reader.readAsDataURL(file);
  };
}

      <button class="del-btn" data-id="${r.id}">✕</button></div>`;
  }).join('');
  list.querySelectorAll('.sport-thumb').forEach(im=>im.addEventListener('click',function(){
    const lb=document.getElementById('lightbox');
    document.getElementById('lightboxImg').src=this.dataset.full;
    lb.style.display='flex';
  }));
  list.querySelectorAll('.del-btn').forEach(b=>b.addEventListener('click',()=>{
    sportData[sportDay]=sportData[sportDay].filter(r=>r.id!==+b.dataset.id);
    if(!sportData[sportDay].length)delete sportData[sportDay];
    S.set('sportRecords',sportData);
    renderSport();
  }));
}

document.getElementById('lightbox').addEventListener('click',function(){this.style.display='none'});

document.getElementById('sportPrev').addEventListener('click',()=>{
  sportMonth=new Date(sportMonth.getFullYear(),sportMonth.getMonth()-1,1);
  renderSport();
});
document.getElementById('sportNext').addEventListener('click',()=>{
  sportMonth=new Date(sportMonth.getFullYear(),sportMonth.getMonth()+1,1);
  renderSport();
});
document.getElementById('sportType').addEventListener('change',function(){
  document.getElementById('routeRow').style.display=this.value==='攀岩'?'flex':'none';
});
document.getElementById('routeAddBtn').addEventListener('click',()=>{
  const grade=document.getElementById('routeGrade').value;
  const count=+document.getElementById('routeCount').value;
  sportRoutes.push({grade,count});
  renderRouteChips();
});
function renderRouteChips(){
  const c=document.getElementById('routeChips');
  c.innerHTML=sportRoutes.map((r,i)=>`<span class="chip">${r.count}条${r.grade}<span class="x" data-i="${i}">✕</span></span>`).join('');
  c.querySelectorAll('.x').forEach(x=>x.addEventListener('click',()=>{
    sportRoutes.splice(+x.dataset.i,1);
    renderRouteChips();
  }));
}

/* ============ SPLASH ============ */
const splash=document.getElementById('splash');
const typeOut=document.getElementById('typeOut');
const fullText='今天也请好好生活!';
const tailText=' :-) ';
let typeI=0,typePhase=0;
function typeTick(){
  if(typePhase===0){
    if(typeI<fullText.length){typeOut.textContent=fullText.slice(0,++typeI);setTimeout(typeTick,170)}
    else{typePhase=1;setTimeout(typeTick,420)}
  }else if(typePhase===1){
    if(typeI>fullText.length-1){typeOut.textContent=fullText.slice(0,--typeI);setTimeout(typeTick,80)}
    else{typePhase=2;typeI=0;setTimeout(typeTick,260)}
  }else if(typePhase===2){
    if(typeI<tailText.length){typeOut.textContent=fullText.slice(0,fullText.length-1)+tailText.slice(0,++typeI);setTimeout(typeTick,110)}
  }
}
typeTick();
function hideSplash(){
  if(!splash||splash.classList.contains('hide'))return;
  splash.classList.add('hide');
  setTimeout(()=>splash.remove(),700);
}
splash.addEventListener('click',hideSplash);
setTimeout(hideSplash,5200);

/* ============ INIT ============ */
renderTasks();
renderMilk();
renderBody();
renderSport();
</script>
</body>
</html>
