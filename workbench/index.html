<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>津津工作台</title>
<style>
@font-face{
  font-family:'ChosunilboNM';
  src:url('ChosunilboNM.woff') format('woff');
  font-display:swap;
}
:root {
  --bg: #FFFDF7; --card: #FFFFFF; --tile: #FBF1DC;
  --primary: #F5B800; --primary-light: #FFD54F; --primary-deep: #D49400;
  --green: #7EC8A0; --orange: #FF8A65; --sky: #87CEEB;
  --ink: #6B4F2A; --ink2: #8A8178; --ink3: #A99E8F;
  --radius: 16px; --shadow: 0 4px 12px rgba(245,184,0,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
  font-size:15px;line-height:1.6;color:var(--ink);
  background:linear-gradient(180deg,#FFFDF7 0%,#F8E8C8 100%);max-width:480px;margin:0 auto;
  min-height:100dvh;padding-bottom:40px;
}
::selection{background:var(--primary-light);color:var(--ink)}

/* Tabs */
.tabs{display:flex;position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 12px 0;gap:6px}
.tab{
  flex:1;text-align:center;padding:10px 4px;border-radius:12px 12px 0 0;
  font-size:.8rem;font-weight:600;color:var(--ink3);cursor:pointer;
  background:transparent;border:none;transition:.2s
}
.tab.active{color:var(--primary);background:var(--card);box-shadow:0 -2px 10px rgba(245,184,0,.16)}
.tab .emoji{display:block;font-size:1.2rem;margin-bottom:2px}

/* Panels */
.panel{display:none;background:var(--card);padding:20px 16px;border-radius:0 0 var(--radius) var(--radius);margin:0 12px;}
.panel.active{display:block}

.section-title{font-size:1.1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title .icon{font-size:1.3rem}

/* Calendar */
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.cal-day{
  aspect-ratio:1;border-radius:12px;background:var(--tile);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:600;color:var(--ink2);cursor:pointer;
  position:relative;transition:.2s;border:2px solid transparent;min-height:56px
}
.cal-day.today{border-color:var(--primary);background:#FFF3D6}
.cal-day .day-stars{display:flex;justify-content:center;gap:1px;margin-top:1px;line-height:1}
.cal-day .day-stars i{font-style:normal;font-size:.55rem;color:var(--primary);-webkit-text-stroke:.4px #FFFDF7;display:inline-block;transform:rotate(-10deg)}
.cal-day .day-stars i:nth-child(even){transform:rotate(10deg)}
.cal-day .day-stars em{font-style:normal;font-size:.5rem;color:var(--primary-deep);font-weight:700}
.cal-day .day-num{font-size:.85rem;margin-bottom:2px}
.cal-day .day-label{font-size:.6rem;color:var(--ink3)}

/* Day detail */
.day-detail{display:none;margin-bottom:16px}
.day-detail.active{display:block}
.day-detail h4{font-size:.9rem;margin-bottom:8px;color:var(--ink2)}
.task-item{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:var(--tile);border-radius:10px;margin-bottom:6px
}
.task-item .badge{
  font-size:.65rem;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap
}
.badge-media{background:rgba(245,184,0,.14);color:var(--primary-deep)}
.badge-daily{background:rgba(135,206,235,.2);color:#3E93B8}
.badge-custom{background:rgba(255,138,101,.15);color:#E06A44}
.task-item .task-title{flex:1;font-size:.85rem}
.task-item .del-btn{font-size:.75rem;color:var(--ink3);cursor:pointer;border:none;background:none;padding:4px}

/* Add task form */
.add-form{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.add-form select,.add-form input{
  padding:10px 12px;border-radius:10px;border:1px solid #EAD9B4;
  font-size:.85rem;background:var(--bg);width:100%
}
.add-form .row{display:flex;gap:8px}
.add-form .save-btn{
  padding:10px;border-radius:10px;background:var(--primary);color:#FFFDF7;
  border:none;font-size:.85rem;font-weight:600;cursor:pointer
}

/* Milk counter */
.big-counter{text-align:center;padding:24px 0}
.big-counter .count{font-size:3.5rem;font-weight:900;line-height:1;font-family:'Montserrat','Poppins','Georgia',serif}
.big-counter .count.cheat{color:var(--primary-deep)}
.big-counter .label{font-size:.85rem;color:var(--ink3);margin-top:6px}
.big-counter .cheat-badge{
  display:inline-block;padding:6px 16px;border-radius:20px;
  background:var(--primary);color:#FFFDF7;font-weight:700;font-size:.85rem;margin-top:8px
}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--tile);border-radius:12px;margin-bottom:16px}
.toggle-row .toggle-label{font-weight:600;font-size:.9rem}
.switch{position:relative;width:52px;height:30px}
.switch input{opacity:0;width:0;height:0}
.switch .slider{
  position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;
  background:#E6D7B4;border-radius:30px;transition:.3s
}
.switch .slider::before{
  content:'';position:absolute;height:24px;width:24px;left:3px;bottom:3px;
  background:#fff;border-radius:50%;transition:.3s
}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider::before{transform:translateX(22px)}
.switch.cheat input:checked+.slider{background:var(--primary)}

/* Photos */
.photo-section{display:flex;gap:12px;margin-bottom:16px}
.photo-card{
  flex:1;background:var(--tile);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;padding:16px 8px;
  gap:8px;cursor:pointer;border:2px dashed #E5CF9E;transition:.2s;min-height:100px;justify-content:center
}
.photo-card.has-photo{border-style:solid;border-color:var(--green)}
.photo-card img{width:100%;border-radius:8px;object-fit:cover;max-height:160px}
.photo-card .label{font-size:.75rem;color:var(--ink3);font-weight:500}
.photo-card .icon{font-size:1.5rem}

/* Counters */
.counter-row{display:flex;gap:12px;margin-bottom:16px}
.counter-box{
  flex:1;background:var(--tile);border-radius:16px;
  padding:20px 16px;text-align:center
}
.counter-box .emoji{font-size:1.5rem;margin-bottom:4px}
.counter-box .num{font-size:2.2rem;font-weight:900;line-height:1;font-family:'Montserrat','Poppins','Georgia',serif}
.counter-box .unit{font-size:.75rem;color:var(--ink3)}
.counter-box .btn-group{display:flex;gap:8px;justify-content:center;margin-top:12px}
.btn-round{
  width:40px;height:40px;border-radius:50%;border:none;
  font-size:1.2rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center
}
.btn-plus{background:var(--primary);color:#FFFDF7}
.btn-minus{background:#EAD9B4;color:var(--ink2)}

/* Collapse */
.collapse{margin-top:16px}
.collapse-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;cursor:pointer;border-top:1px solid #F0E1C0;font-weight:600;font-size:.9rem
}
.collapse-header .arrow{transition:.25s;font-size:.75rem}
.collapse.open .arrow{transform:rotate(180deg)}
.collapse-body{display:none;padding-bottom:12px}
.collapse.open .collapse-body{display:block}

/* Weekly summary */
.summary-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.summary-day{
  text-align:center;padding:8px 2px;border-radius:8px;background:var(--bg);font-size:.65rem
}
.summary-day .s-num{font-size:.9rem;font-weight:700;display:block}
.summary-day.done{background:rgba(126,200,160,.16);color:#4F9C6F}
.summary-day.missed{background:rgba(255,138,101,.14);color:#E06A44}

.photo-compare{display:flex;overflow-x:auto;gap:8px;padding-bottom:8px}
.photo-compare .compare-card{
  min-width:70px;border-radius:10px;background:var(--tile);padding:6px;text-align:center;font-size:.65rem
}
.photo-compare .compare-card img{width:100%;border-radius:6px;object-fit:cover;height:60px}
.photo-compare .compare-card .day-label{font-weight:600;margin:4px 0}

.history-table{width:100%;font-size:.8rem}
.history-table td,.history-table th{padding:8px 4px;text-align:center}
.history-table th{color:var(--ink3);font-weight:500;border-bottom:2px solid #F0E1C0}
.history-table td{border-bottom:1px solid #F7EEDC}


.empty{text-align:center;color:var(--ink3);font-size:.8rem;padding:12px 0}

/* Splash screen */
.splash{
  position:fixed;inset:0;z-index:999;
  background:linear-gradient(135deg,#FFD54F 0%,#F5B800 100%);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .6s ease;cursor:pointer
}
.splash.hide{opacity:0;pointer-events:none}
.yarn-ball{width:52px;height:52px;display:block;margin:0 auto 16px}
.yarn-bob{animation:yarnBob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.yarn-core{animation:yarnSpin 3s linear infinite;transform-box:fill-box;transform-origin:center}
.yarn-shadow{animation:yarnShadow 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.splash-text{
  color:#FFFDF7;font-family:'ChosunilboNM','Chosunilbo NM',sans-serif;
  font-size:1.9rem;font-weight:400;letter-spacing:.3em;text-indent:.3em;
  position:relative;z-index:2
}
@keyframes yarnBob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}
@keyframes yarnSpin{
  from{transform:rotate(0)}
  to{transform:rotate(360deg)}
}
@keyframes yarnShadow{
  0%,100%{transform:scaleX(1);opacity:.22}
  50%{transform:scaleX(.8);opacity:.12}
}
</style>
</head>
<body>

<!-- Splash screen -->
<div class="splash" id="splash">
  <div>
    <svg class="yarn-ball" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <filter id="mohair" x="-40%" y="-40%" width="180%" height="180%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
        </filter>
      </defs>
      <ellipse class="yarn-shadow" cx="32" cy="57" rx="17" ry="3.2" fill="#6B4F2A" opacity=".22"/>
      <g class="yarn-bob">
        <g class="yarn-core" filter="url(#mohair)">
          <circle cx="32" cy="33" r="19" fill="#D49400"/>
          <path d="M16 25 Q32 17 48 25 M14 33 Q32 43 50 33 M18 43 Q32 49 46 43 M22 21 Q32 29 42 21" stroke="#6B4F2A" stroke-width="1.8" fill="none" opacity=".75"/>
          <path d="M20 21 Q26 16 32 18" stroke="#FFD54F" stroke-width="2.1" fill="none" stroke-linecap="round" opacity=".85"/>
        </g>
        <g stroke="#D49400" stroke-width="1" stroke-linecap="round" opacity=".95">
          <path d="M12.5 27 l-4.5 -1.2 M12.5 33 l-5.5 0 M13.5 39 l-4.5 2 M51.5 27 l4.5 -1.2 M51.5 33 l5.5 0 M50.5 39 l4.5 2 M20 14.5 l-1 -4.5 M32 13.5 l0 -5.5 M44 14.5 l1 -4.5 M20 52 l-1 4 M32 53 l0 5 M44 52 l1 4"/>
        </g>
        <path d="M32 15 Q26 4 12 6 Q4 8 6 15" stroke="#D49400" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".95"/>
        <path d="M32 15 Q26 4 12 6 Q4 8 6 15" stroke="#6B4F2A" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".5" transform="translate(.8,0)"/>
      </g>
    </svg>
    <div class="splash-text">祝你好好生活</div>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" data-tab="tasks"><span class="emoji">📋</span>每周任务</button>
  <button class="tab" data-tab="milk"><span class="emoji">🥛</span>戒牛奶</button>
  <button class="tab" data-tab="body"><span class="emoji">💩</span>拉粑喝水</button>
</div>

<!-- Panel 1: 每周任务 -->
<div class="panel active" id="panel-tasks">
  <div class="section-title"><span class="icon">📋</span>每周任务</div>
  <div class="calendar" id="taskCal"></div>
  <div class="day-detail" id="dayDetail">
    <h4 id="dayDetailTitle"></h4>
    <div id="dayTaskList"></div>
  </div>

  <div class="add-form">
    <select id="taskType">
      <option value="自媒体更新">自媒体更新</option>
      <option value="日常事件">日常事件</option>
      <option value="__custom">自定义…</option>
    </select>
    <input type="text" id="customType" placeholder="输入自定义类型" style="display:none">
    <div class="row">
      <select id="taskDay">
        <option value="周一">周一</option><option value="周二">周二</option>
        <option value="周三">周三</option><option value="周四">周四</option>
        <option value="周五">周五</option><option value="周六">周六</option>
        <option value="周日">周日</option>
      </select>
      <input type="text" id="taskTitle" placeholder="更新内容标题…">
    </div>
    <button class="save-btn" id="addTaskBtn">➕ 添加任务</button>
  </div>

  <div class="collapse" id="taskSummary">
    <div class="collapse-header"><span>📊 本周总结</span><span class="arrow">▼</span></div>
    <div class="collapse-body"><div id="taskSummaryContent"></div></div>
  </div>
</div>

<!-- Panel 2: 戒牛奶 -->
<div class="panel" id="panel-milk">
  <div class="section-title"><span class="icon">🥛</span>戒牛奶</div>

  <div class="big-counter" id="milkCounter">
    <div class="count" id="milkDays">--</div>
    <div class="label">已戒第 <span id="milkDaysNum">--</span> 天</div>
    <div class="cheat-badge" id="cheatBadge" style="display:none">🎉 放纵日</div>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">今日打卡</span>
    <label class="switch" id="milkSwitchWrap">
      <input type="checkbox" id="milkToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="photo-section">
    <div class="photo-card" id="photoFace">
      <span class="icon">🧑</span>
      <span class="label">脸部照片</span>
      <input type="file" accept="image/*" capture="user" style="display:none" id="faceInput">
    </div>
    <div class="photo-card" id="photoLegs">
      <span class="icon">🦵</span>
      <span class="label">腿部照片</span>
      <input type="file" accept="image/*" capture="environment" style="display:none" id="legsInput">
    </div>
  </div>

  <div class="collapse" id="milkSummary">
    <div class="collapse-header"><span>📊 本周总结（7天照片对比）</span><span class="arrow">▼</span></div>
    <div class="collapse-body"><div id="milkSummaryContent"></div></div>
  </div>
</div>

<!-- Panel 3: 拉粑喝水 -->
<div class="panel" id="panel-body">
  <div class="section-title"><span class="icon">💩</span>今日记录</div>

  <div class="counter-row">
    <div class="counter-box">
      <div class="emoji">💧</div>
      <div class="num" id="waterCount">0</div>
      <div class="unit">升 / 今日</div>
      <div class="btn-group">
        <button class="btn-round btn-minus" id="waterMinus">−</button>
        <button class="btn-round btn-plus" id="waterPlus">+</button>
      </div>
    </div>
    <div class="counter-box">
      <div class="emoji">💩</div>
      <div class="num" id="poopCount">0</div>
      <div class="unit">次 / 今日</div>
      <div class="btn-group">
        <button class="btn-round btn-minus" id="poopMinus">−</button>
        <button class="btn-round btn-plus" id="poopPlus">+</button>
      </div>
    </div>
  </div>

  <div class="collapse" id="bodyHistory">
    <div class="collapse-header"><span>📅 历史记录（最近7天）</span><span class="arrow">▼</span></div>
    <div class="collapse-body"><div id="bodyHistoryContent"></div></div>
  </div>
</div>

<script>
/* ==================== STORAGE ==================== */
const S = {
  mem:{},
  get(k,d){try{const v=localStorage.getItem('jinjin_'+k);return v?JSON.parse(v):d}catch(e){return this.mem[k]!==undefined?this.mem[k]:d}},
  set(k,v){this.mem[k]=v;try{localStorage.setItem('jinjin_'+k,JSON.stringify(v))}catch(e){}}
};

/* ==================== HELPERS ==================== */
function today(){return new Date().toISOString().slice(0,10)}
function getMonday(d){
  const dt=new Date(d);const day=dt.getDay();
  const diff=day===0?-6:1-day;dt.setDate(dt.getDate()+diff);
  return dt.toISOString().slice(0,10);
}
function weekDays(){
  const m=getMonday(today());const days=[];
  for(let i=0;i<7;i++){const d=new Date(m);d.setDate(d.getDate()+i);days.push(d.toISOString().slice(0,10))}
  return days;
}
function dayLabel(d){const dt=new Date(d+'T00:00');return['周日','周一','周二','周三','周四','周五','周六'][dt.getDay()]}
function dayNum(d){return new Date(d+'T00:00').getDate()}
function fmtDate(d){const dt=new Date(d+'T00:00');return `${dt.getMonth()+1}/${dt.getDate()}`}

/* ==================== TAB SWITCHING ==================== */
document.querySelectorAll('.tab').forEach(t=>{t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('panel-'+t.dataset.tab).classList.add('active');
  if(t.dataset.tab==='tasks')renderTasks();
  if(t.dataset.tab==='milk')renderMilk();
  if(t.dataset.tab==='body')renderBody();
})});

/* ==================== COLLAPSE ==================== */
document.querySelectorAll('.collapse-header').forEach(h=>{
  h.addEventListener('click',()=>h.parentElement.classList.toggle('open'))
});

/* ============ TASKS ============ */
let tasks=S.get('tasks',[]);
let selectedDay=null;

function renderTasks(){
  const cal=document.getElementById('taskCal');
  const days=weekDays();const td=today();
  cal.innerHTML=days.map((d,i)=>{
    const cnt=tasks.filter(t=>t.day===dayLabel(d)).length;
    const cls=['cal-day',d===td?'today':''].filter(Boolean).join(' ');
    const stars=cnt>0?`<span class="day-stars">${'<i>★</i>'.repeat(Math.min(cnt,4))}${cnt>4?`<em>+${cnt-4}</em>`:''}</span>`:'';
    return `<div class="${cls}" data-day="${dayLabel(d)}" data-date="${d}">
      <span class="day-num">${dayNum(d)}</span><span class="day-label">${dayLabel(d)}</span>${stars}</div>`;
  }).join('');

  cal.querySelectorAll('.cal-day').forEach(el=>el.addEventListener('click',()=>{
    selectedDay=el.dataset.day;
    showDayDetail(el.dataset.day);
    cal.querySelectorAll('.cal-day').forEach(x=>x.style.borderColor=x.classList.contains('today')?'var(--primary)':'transparent');
    el.style.borderColor='var(--orange)';
  }));

  if(selectedDay)showDayDetail(selectedDay);
  renderTaskSummary();
}

function showDayDetail(day){
  document.getElementById('dayDetail').classList.add('active');
  document.getElementById('dayDetailTitle').textContent=day+' 的任务';
  const list=document.getElementById('dayTaskList');
  const dayTasks=tasks.filter(t=>t.day===day);
  if(!dayTasks.length){list.innerHTML='<div class="empty">暂无任务，下方添加</div>';return}
  list.innerHTML=dayTasks.map(t=>{
    const cls=t.type==='自媒体更新'?'badge-media':t.type==='日常事件'?'badge-daily':'badge-custom';
    return `<div class="task-item">
      <span class="badge ${cls}">${t.type}</span>
      <span class="task-title">${t.title||'(无标题)'}</span>
      <button class="del-btn" data-id="${t.id}">✕</button></div>`;
  }).join('');
  list.querySelectorAll('.del-btn').forEach(b=>b.addEventListener('click',()=>{
    tasks=tasks.filter(t=>t.id!==+b.dataset.id);
    S.set('tasks',tasks);
    renderTasks();
  }));
}

document.getElementById('taskType').addEventListener('change',function(){
  document.getElementById('customType').style.display=this.value==='__custom'?'block':'none';
});

document.getElementById('addTaskBtn').addEventListener('click',()=>{
  let type=document.getElementById('taskType').value;
  if(type==='__custom'){type=document.getElementById('customType').value.trim();if(!type)return}
  const day=document.getElementById('taskDay').value;
  const title=document.getElementById('taskTitle').value.trim();
  tasks.push({id:Date.now(),type,day,title});
  S.set('tasks',tasks);
  document.getElementById('taskTitle').value='';
  document.getElementById('customType').value='';
  selectedDay=day;
  renderTasks();
});

function renderTaskSummary(){
  const c=document.getElementById('taskSummaryContent');
  const wp=weekDays().map(d=>dayLabel(d));
  const mediaTasks=tasks.filter(t=>t.type==='自媒体更新');
  const dailyTasks=tasks.filter(t=>t.type==='日常事件');
  c.innerHTML=`
    <p style="font-weight:600;margin-bottom:8px">📈 自媒体更新 · ${mediaTasks.length} 项</p>
    <div class="summary-grid">${wp.map(d=>{
      const count=tasks.filter(t=>t.day===d).length;
      return `<div class="summary-day ${count>0?'done':'missed'}"><span class="s-num">${count}</span>${d}</div>`;
    }).join('')}</div>
    <p style="font-weight:600;margin:16px 0 8px">📝 全部任务清单</p>
    ${tasks.length?tasks.map(t=>`<div style="font-size:.8rem;padding:4px 0;display:flex;gap:8px">
      <span style="color:var(--ink3);min-width:36px">${t.day}</span>
      <span style="font-size:.65rem;padding:2px 6px;border-radius:10px;background:rgba(245,184,0,.14);color:var(--primary-deep)">${t.type}</span>
      <span>${t.title||'(无标题)'}</span></div>`).join(''):'<div class="empty">暂无任务</div>'}
  `;
}

/* ============ MILK ============ */
function milkData(){
  const start=S.get('milkStart','');
  const checks=S.get('milkChecks',{});
  const photos=S.get('milkPhotos',{});
  return {start,checks,photos};
}

function isCheatDay(start){
  if(!start)return false;
  const diff=Math.floor((new Date(today())-new Date(start))/(86400000));
  return diff>=0&&diff%14===13; // day 14, 28, 42...
}

function renderMilk(){
  let {start,checks,photos}=milkData();
  const td=today();

  // 首次打开：默认从打开界面的当天开始戒奶结算
  if(!start){start=td;S.set('milkStart',start)}

  const diff=Math.floor((new Date(td)-new Date(start))/(86400000));
  const days=Math.max(0,diff);
  const cheat=isCheatDay(start);

  document.getElementById('milkDays').textContent=days;
  document.getElementById('milkDaysNum').textContent=days;
  document.getElementById('milkDays').className='count'+(cheat?' cheat':'');
  document.getElementById('cheatBadge').style.display=cheat?'inline-block':'none';

  const toggle=document.getElementById('milkToggle');
  toggle.checked=!!checks[td];
  document.getElementById('milkSwitchWrap').className='switch'+(cheat?' cheat':'');

  toggle.onchange=function(){checks[td]=this.checked;S.set('milkChecks',checks);renderMilk()};

  // Photos
  const pToday=photos[td]||{};
  renderPhotoCard('photoFace','face',pToday.face);
  renderPhotoCard('photoLegs','legs',pToday.legs);

  renderMilkSummary();
}

function renderPhotoCard(id,key,src){
  const card=document.getElementById(id);
  const input=card.querySelector('input');
  if(src){
    card.classList.add('has-photo');
    const existing=card.querySelector('img');
    if(existing)existing.src=src;
    else{
      const img=document.createElement('img');img.src=src;
      card.querySelector('.icon')?.remove();
      card.prepend(img);
    }
  }else{
    card.classList.remove('has-photo');
    const img=card.querySelector('img');if(img)img.remove();
    if(!card.querySelector('.icon')){
      const icon=document.createElement('span');icon.className='icon';
      icon.textContent=key==='face'?'🧑':'🦵';
      card.prepend(icon);
    }
  }
  input.onchange=function(){
    const file=this.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(){
      const photos=S.get('milkPhotos',{});
      if(!photos[today()])photos[today()]={};
      photos[today()][key]=reader.result;
      S.set('milkPhotos',photos);
      renderMilk();
    };
    reader.readAsDataURL(file);
  };
}

document.getElementById('photoFace').addEventListener('click',function(e){
  if(e.target.tagName==='INPUT')return;
  this.querySelector('input').click();
});
document.getElementById('photoLegs').addEventListener('click',function(e){
  if(e.target.tagName==='INPUT')return;
  this.querySelector('input').click();
});

function renderMilkSummary(){
  const c=document.getElementById('milkSummaryContent');
  const {start,checks,photos}=milkData();
  const wd=weekDays();
  c.innerHTML=`
    <div class="summary-grid" style="margin-bottom:12px">${wd.map(d=>{
      const done=!!checks[d];return `<div class="summary-day ${done?'done':'missed'}">
        <span class="s-num">${done?'✅':'❌'}</span>${fmtDate(d)}</div>`;
    }).join('')}</div>
    <div class="photo-compare">${wd.map(d=>{
      const p=photos[d]||{};
      return `<div class="compare-card">
        <div class="day-label">${fmtDate(d)}</div>
        ${p.face?`<img src="${p.face}" alt="face">`:'<div style="height:60px;display:flex;align-items:center;justify-content:center;font-size:.6rem;color:var(--ink3)">无照片</div>'}
        ${p.legs?`<img src="${p.legs}" alt="legs" style="margin-top:2px">`:''}
      </div>`;
    }).join('')}</div>
  `;
}

/* ============ BODY (Water & Poop) ============ */
function renderBody(){
  const td=today();
  const waterLogs=S.get('waterLogs',{});
  const poopLogs=S.get('poopLogs',{});
  document.getElementById('waterCount').textContent=waterLogs[td]||0;
  document.getElementById('poopCount').textContent=poopLogs[td]||0;
  renderBodyHistory();
}

document.getElementById('waterPlus').addEventListener('click',()=>{
  const td=today();const logs=S.get('waterLogs',{});
  logs[td]=(logs[td]||0)+1;S.set('waterLogs',logs);renderBody();
});
document.getElementById('waterMinus').addEventListener('click',()=>{
  const td=today();const logs=S.get('waterLogs',{});
  logs[td]=Math.max(0,(logs[td]||0)-1);S.set('waterLogs',logs);renderBody();
});
document.getElementById('poopPlus').addEventListener('click',()=>{
  const td=today();const logs=S.get('poopLogs',{});
  logs[td]=(logs[td]||0)+1;S.set('poopLogs',logs);renderBody();
});
document.getElementById('poopMinus').addEventListener('click',()=>{
  const td=today();const logs=S.get('poopLogs',{});
  logs[td]=Math.max(0,(logs[td]||0)-1);S.set('poopLogs',logs);renderBody();
});

function renderBodyHistory(){
  const c=document.getElementById('bodyHistoryContent');
  const waterLogs=S.get('waterLogs',{});
  const poopLogs=S.get('poopLogs',{});
  const wd=weekDays();
  let maxW=0,maxP=0;
  wd.forEach(d=>{maxW=Math.max(maxW,waterLogs[d]||0);maxP=Math.max(maxP,poopLogs[d]||0)});

  c.innerHTML=`
    <table class="history-table">
      <tr><th>日期</th><th>💧 喝水(L)</th><th>💩 拉粑(次)</th></tr>
      ${wd.map(d=>`<tr>
        <td style="font-weight:600">${fmtDate(d)} ${dayLabel(d)}</td>
        <td>${'█'.repeat(waterLogs[d]||0)}${waterLogs[d]||0}L</td>
        <td>${'●'.repeat(poopLogs[d]||0)}${poopLogs[d]||0}次</td>
      </tr>`).join('')}
    </table>
  `;
}

/* ============ SPLASH ============ */
const splash=document.getElementById('splash');
function hideSplash(){
  if(!splash||splash.classList.contains('hide'))return;
  splash.classList.add('hide');
  setTimeout(()=>splash.remove(),700);
}
splash.addEventListener('click',hideSplash);
setTimeout(hideSplash,2200);

/* ============ INIT ============ */
renderTasks();
renderMilk();
renderBody();
</script>
</body>
